name: Quality checks

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: web
      - run: python -m pytest
      - run: npm run build
        working-directory: web
        env:
          PUBLICATION_AS_OF_DATE: "2026-08-25"
          LEGAL_ADDRESS: "CI test address — not a deployment value"
      - run: >-
          python -m public_release
          --output build/gate3-public-release
          --known-withheld-catalog public_release/known-withheld-candidates.json
          --known-withheld-manifest build/public-release-known-withheld.json
          --export-output web/dist
      - run: python scripts/check_build_log_hashes.py
