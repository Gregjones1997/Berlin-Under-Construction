[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "berlin-under-construction"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pikepdf==10.11.0",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pipeline*", "public_release*"]
